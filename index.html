<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הטיול שלנו לתאילנד</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
  <header class="hero">
    <div class="sun"></div>
    <div class="hero-content">
      <p class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> תאילנד · אוגוסט 2027</p>
      <h1 id="title"></h1>
      <p id="subtitle" class="subtitle"></p>
      <div id="countdown" class="countdown"></div>
    </div>
    <svg class="waves" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,64 C240,120 480,0 720,48 C960,96 1200,24 1440,64 L1440,120 L0,120 Z" fill="var(--bg)"/>
    </svg>
  </header>

  <nav class="tabs">
    <a href="#travelers"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg> מטיילים</a>
    <a href="#flights"><svg class="icon" aria-hidden="true"><use href="#i-plane"/></svg> טיסות</a>
    <a href="#route"><svg class="icon" aria-hidden="true"><use href="#i-route"/></svg> מסלול</a>
    <a href="#days"><svg class="icon" aria-hidden="true"><use href="#i-calendar-days"/></svg> יום-יום</a>
    <a href="#hotels"><svg class="icon" aria-hidden="true"><use href="#i-bed-double"/></svg> מלונות</a>
    <a href="#attractions"><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> אטרקציות</a>
  </nav>

  <main>
    <section id="travelers">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg> המטיילים</h2>
      <div id="travelers-list" class="travelers"></div>
    </section>

    <section id="flights">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-plane"/></svg> טיסות</h2>
      <div id="flights-list" class="grid"></div>
    </section>

    <section id="route">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-route"/></svg> המסלול</h2>
      <div id="route-list" class="route"></div>
    </section>

    <section id="days">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-calendar-days"/></svg> יום אחרי יום</h2>
      <div id="days-list" class="days"></div>
    </section>

    <section id="hotels">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-bed-double"/></svg> מלונות</h2>
      <div id="hotels-list" class="grid"></div>
    </section>

    <section id="attractions">
      <h2><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> אטרקציות ורעיונות</h2>
      <div id="attractions-list"></div>
    </section>
  </main>

  <footer>נבנה באהבה לקראת הטיול</footer>

  <dialog id="add-dialog" class="add-dialog">
    <form id="add-form" method="dialog" novalidate>
      <div class="dialog-head">
        <h2>הוספה לטיול</h2>
        <button type="button" class="close-btn" id="add-close" aria-label="סגירה"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>

      <fieldset class="type-picker">
        <legend>מה מוסיפים?</legend>
        <label><input type="radio" name="type" value="אטרקציה / רעיון" checked><span><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> אטרקציה / רעיון</span></label>
        <label><input type="radio" name="type" value="מלון"><span><svg class="icon" aria-hidden="true"><use href="#i-bed-double"/></svg> מלון</span></label>
        <label><input type="radio" name="type" value="תוכנית ליום"><span><svg class="icon" aria-hidden="true"><use href="#i-calendar-days"/></svg> תוכנית ליום</span></label>
      </fieldset>

      <label class="field"><span>עיר / מקום</span>
        <input name="city" list="city-options" placeholder="לדוגמה: פוקט" autocomplete="off">
        <datalist id="city-options"></datalist>
      </label>

      <label class="field"><span data-label-for="name">שם</span>
        <input name="name" placeholder="">
      </label>

      <div class="field-row">
        <label class="field" data-show="hotel day"><span data-label-for="date">תאריך</span>
          <input type="date" name="date">
        </label>
        <label class="field" data-show="hotel"><span>עד תאריך (צ'ק-אאוט)</span>
          <input type="date" name="endDate">
        </label>
      </div>

      <fieldset class="field status-picker" data-show="hotel">
        <legend>סטטוס</legend>
        <label><input type="radio" name="status" value="בבדיקה" checked><span><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg> בבדיקה</span></label>
        <label><input type="radio" name="status" value="הוזמן"><span><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg> הוזמן</span></label>
      </fieldset>

      <label class="field"><span>קישור (לא חובה)</span>
        <input type="url" name="link" placeholder="https://..." dir="ltr">
      </label>

      <label class="field"><span data-label-for="notes">פרטים / הערות</span>
        <textarea name="notes" rows="3"></textarea>
      </label>

      <p class="form-error" id="add-error" hidden></p>
      <button type="submit" class="save-btn" id="add-save">שמירה</button>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="icons.js?v=15"></script>
  <script src="data.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
